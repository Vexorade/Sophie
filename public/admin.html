<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sophie · Panel</title>
<style>
:root{--ink:#303c35;--muted:#7a8276;--line:#e3e5dd;--accent:#657659;--bg:#f5f5f1;--card:#fff;--bad:#a33}
*{box-sizing:border-box}
body{margin:0;font:14px system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;padding:12px 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font:22px Georgia,serif;margin:0 12px 0 0}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font:inherit}
nav button.on{background:#eef1e8;color:var(--ink);font-weight:600}
main{padding:20px;max-width:1280px;margin:0 auto}
h2{font:20px Georgia,serif;margin:0 0 14px}
h3{font-size:13px;margin:0 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.grid{display:grid;gap:14px}
.k{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.two{grid-template-columns:1fr 1fr}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.kpi b{display:block;font-size:24px;margin-top:6px}
.kpi small{color:var(--muted)}
.bar{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar i{display:block;height:12px;background:var(--accent);border-radius:6px;min-width:2px}
.bar em{font-style:normal;color:var(--muted)}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-size:12px;font-weight:600}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #cfd3c8;border-radius:8px;width:100%;background:#fff}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.inline label{margin:0;color:var(--ink);font-size:13px;display:inline-flex;gap:6px;align-items:center}
.inline input{width:auto}
button{font:inherit;cursor:pointer;border-radius:8px;padding:8px 12px;border:1px solid var(--line);background:#fff;color:var(--ink)}
button.p{background:var(--accent);color:#fff;border-color:var(--accent)}
button.d{color:var(--bad);border-color:#e7c4c4}
button.s{background:#eef1e8}
button:disabled{opacity:.5;cursor:not-allowed}
.thumb{width:56px;height:56px;object-fit:cover;border-radius:8px;background:#eee}
.gallery{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.gallery figure{margin:0;width:110px;text-align:center;font-size:11px;color:var(--muted)}
.gallery img{width:110px;height:110px;object-fit:cover;border-radius:10px;background:#eee;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{margin:0;display:inline-flex;align-items:center;gap:6px;background:#f3f4ef;padding:6px 10px;border-radius:20px;color:var(--ink);font-size:13px}
.chips input{width:auto}
.badge{display:inline-block;padding:3px 8px;border-radius:12px;background:#eef1e8;font-size:12px;margin:2px 2px 2px 0}
.badge.warn{background:#fdf1dc}
.badge.bad{background:#fbe3e3}
.badge.ok{background:#e1efdc}
.msg{padding:10px 12px;border-radius:8px;background:#eef1e8;margin:10px 0}
.msg.err{background:#fbeaea;color:var(--bad)}
.muted{color:var(--muted)}
.small{font-size:12px}
.swatch{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#ddd}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filters button.on{background:#eef1e8;font-weight:600}
</style>
</head>
<body>
<header>
  <h1>Sophie</h1>
  <nav id="nav"></nav>
</header>
<main id="app"></main>

<script>
const $ = (s) => document.querySelector(s);
const money = (n) => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(n);
const pesos = (cents) => (cents || 0) / 100;
const STATUS = { awaiting_transfer: 'Esperando transferencia', creating_checkout: 'Preparando pago', pending: 'Pendiente de pago',
  paid: 'Pagado', paid_test: 'Prueba aprobada', rejected: 'Pago rechazado', cancelled: 'Cancelado', refunded: 'Reintegrado',
  charged_back: 'Contracargo', review: 'En revisión', checkout_error: 'Error MP' };
const FULFILL = { nuevo: ['Nuevo', 'warn'], aceptado: ['Aceptado', 'ok'], entregado: ['Entregado', 'ok'], rechazado: ['Rechazado', 'bad'] };

const h = (tag, props = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k === 'value') e.value = v;
    else if (k === 'checked') e.checked = !!v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
};

async function api(path, opts = {}) {
  const isBlob = opts.body instanceof Blob;
  const r = await fetch(path, {
    cache: 'no-store', method: opts.method || 'GET',
    headers: isBlob ? { 'Content-Type': opts.body.type } : (opts.body ? { 'Content-Type': 'application/json' } : {}),
    body: isBlob ? opts.body : opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && !path.includes('/login')) { showLogin(); throw Error('Iniciá sesión para continuar.'); }
  if (!r.ok) throw Error(j.error || 'Error ' + r.status);
  return j;
}

// Reduce la imagen en el navegador antes de subirla: WEBP, lado máximo configurable.
async function compress(file, maxSide) {
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  let blob = await new Promise((r) => c.toBlob(r, 'image/webp', 0.8));
  if (!blob) blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.85));
  if (blob.size > 2 * 1024 * 1024) throw Error('La imagen sigue siendo muy pesada. Probá con otra más chica.');
  return blob;
}

async function uploadImage(file, maxSide = 1400) {
  const blob = await compress(file, maxSide);
  const j = await api('/api/admin/images', { method: 'POST', body: blob });
  return j.id;
}

const state = { tab: 'dashboard', catalog: null, orderFilter: 'todos', period: '30', range: null };
const TABS = [['dashboard', 'Dashboard'], ['pedidos', 'Pedidos'], ['productos', 'Productos'], ['telas', 'Telas y colores'], ['patas', 'Maderas y patas'], ['config', 'Configuración']];
const PERIODS = [['hoy', 'Hoy'], ['7', 'Últimos 7 días'], ['30', 'Últimos 30 días'], ['mes', 'Este mes'], ['anio', 'Este año'], ['todo', 'Todo'], ['custom', 'Personalizado']];

function nav() {
  $('#nav').replaceChildren(...TABS.map(([k, t]) => h('button', { class: state.tab === k ? 'on' : '', onclick: () => go(k) }, t)),
    h('button', { onclick: async () => { await fetch('/api/admin/logout', { method: 'POST' }); showLogin(); } }, 'Salir'));
}

async function go(tab, arg) {
  state.tab = tab; nav();
  const app = $('#app');
  app.replaceChildren(h('p', { class: 'muted' }, 'Cargando…'));
  try {
    if (!state.catalog || tab !== 'pedidos' && tab !== 'dashboard') state.catalog = await api('/api/admin/catalog');
    const views = { dashboard: viewDashboard, pedidos: viewOrders, productos: viewProducts, telas: viewFabrics, patas: viewLegs, config: viewSettings };
    await views[tab](arg);
  } catch (e) {
    app.replaceChildren(h('div', { class: 'msg err' }, e.message));
  }
}

function rangeFor(key) {
  const ar = new Date(Date.now() - 3 * 3600e3); // hora de Argentina
  const iso = (d) => d.toISOString().slice(0, 10);
  const today = iso(ar);
  switch (key) {
    case 'hoy': return { from: today, to: today };
    case '7': return { from: iso(new Date(ar - 6 * 864e5)), to: today };
    case '30': return { from: iso(new Date(ar - 29 * 864e5)), to: today };
    case 'mes': return { from: today.slice(0, 8) + '01', to: today };
    case 'anio': return { from: today.slice(0, 4) + '-01-01', to: today };
    case 'todo': return { from: '', to: '' };
    default: return state.range || rangeFor('30');
  }
}
function qsRange() {
  const r = state.range || {}; const p = [];
  if (r.from) p.push('from=' + r.from);
  if (r.to) p.push('to=' + r.to);
  return p.length ? '?' + p.join('&') : '';
}
function periodBar() {
  if (!state.range) state.range = rangeFor('30');
  const dates = state.period === 'custom' ? [
    h('input', { type: 'date', value: state.range.from, onchange: (e) => { state.range = { ...state.range, from: e.target.value }; go(state.tab); } }),
    h('input', { type: 'date', value: state.range.to, onchange: (e) => { state.range = { ...state.range, to: e.target.value }; go(state.tab); } }),
  ] : [];
  return h('div', { class: 'filters' },
    PERIODS.map(([k, t]) => h('button', { class: state.period === k ? 'on' : '', onclick: () => {
      state.period = k; state.range = k === 'custom' ? (state.range || rangeFor('30')) : rangeFor(k); go(state.tab);
    } }, t)), dates);
}

const kpi = (label, value, sub) => h('div', { class: 'card kpi' }, h('small', {}, label), h('b', {}, value), sub ? h('small', {}, sub) : null);

function bars(rows, fmt = (v) => v) {
  if (!rows.length) return h('p', { class: 'muted' }, 'Sin datos todavía.');
  const max = Math.max(...rows.map((r) => r.value), 1);
  return rows.map((r) => h('div', { class: 'bar' }, h('span', { title: r.label }, r.label),
    h('i', { style: `width:${Math.max(2, (r.value / max) * 100)}%` }), h('em', {}, fmt(r.value))));
}

async function viewDashboard() {
  const s = await api('/api/admin/stats' + qsRange());
  const t = s.totals;
  const fmtCount = (v) => String(v);
  const byDayRows = s.byDay.map((d) => ({ label: d.day, value: d.count }));
  $('#app').replaceChildren(
    periodBar(),
    h('div', { class: 'grid k' },
      kpi('Pedidos totales', t.total),
      kpi('Hoy', t.today),
      kpi('Últimos 7 días', t.week),
      kpi('Últimos 30 días', t.month),
      kpi('Por aceptar', t.nuevos, 'pedidos nuevos'),
      kpi('Cobrado', money(pesos(t.cobrado)), 'pagos confirmados'),
      kpi('Por cobrar', money(pesos(t.por_cobrar)), 'señas y pagos pendientes'),
      kpi('Ticket promedio', money(pesos(t.ticket)))),
    h('div', { class: 'grid two', style: 'margin-top:14px' },
      h('div', { class: 'card' }, h('h3', {}, 'Pedidos por día (30 días)'), bars(byDayRows, fmtCount)),
      h('div', { class: 'card' }, h('h3', {}, 'Modelos más pedidos'),
        bars(s.byProduct.map((p) => ({ label: p.name, value: p.count })), fmtCount)),
      h('div', { class: 'card' }, h('h3', {}, 'Colores más pedidos'),
        bars(s.byColor.map((c) => ({ label: c.name, value: c.count })), fmtCount)),
      h('div', { class: 'card' }, h('h3', {}, 'Medios de pago'),
        bars(s.byPayment.map((p) => ({ label: p.name, value: p.count })), fmtCount)),
      h('div', { class: 'card' }, h('h3', {}, 'Patas y maderas'),
        bars(s.byLeg.map((p) => ({ label: p.name, value: p.count })), fmtCount)),
      h('div', { class: 'card' }, h('h3', {}, 'Estado de los pagos'),
        bars(s.byStatus.map((p) => ({ label: STATUS[p.name] || p.name, value: p.count })), fmtCount)),
    ),
    h('p', { class: 'muted small', style: 'margin-top:14px' }, 'Pagos de prueba aprobados: ' + money(pesos(t.cobrado_prueba)) + ' (no son ingresos reales).'),
  );
}

// --- Pedidos -----------------------------------------------------------

async function viewOrders() {
  const { orders } = await api('/api/admin/orders' + qsRange());
  const f = state.orderFilter;
  const list = f === 'todos' ? orders : orders.filter((o) => o.fulfillment === f);
  const filterBtns = [['todos', 'Todos'], ['nuevo', 'Nuevos'], ['aceptado', 'Aceptados'], ['entregado', 'Entregados'], ['rechazado', 'Rechazados']]
    .map(([k, t]) => h('button', { class: f === k ? 'on' : '', onclick: () => { state.orderFilter = k; go('pedidos'); } }, t));
  const rowFor = (o) => {
    const p = o.product, s = o.selection;
    const colors = p.colorMode === 'split' ? `${p.colorLeft.name} (izq.) · ${p.colorRight.name} (der.)` : p.colorLeft.name;
    const pending = o.status === 'awaiting_transfer';
    const actions = [];
    if (o.fulfillment === 'nuevo' || o.fulfillment === 'rechazado') actions.push(h('button', { class: 'p', onclick: () => act(o, 'accept') }, 'Aceptar'));
    if (o.fulfillment === 'nuevo' || o.fulfillment === 'aceptado') actions.push(h('button', { class: 'd', onclick: () => reject(o) }, 'Rechazar'));
    if (o.fulfillment === 'aceptado') actions.push(h('button', { onclick: () => act(o, 'deliver') }, 'Marcar entregado'));
    if (pending) actions.push(h('button', { class: 's', onclick: () => confirmTransfer(o) }, 'Confirmar transferencia'));
    actions.push(h('button', { class: 'd', onclick: () => removeOrder(o) }, 'Borrar pedido'));
    const fb = FULFILL[o.fulfillment] || [o.fulfillment, ''];
    return h('tr', {},
      h('td', { class: 'small' }, new Date(o.createdAt).toLocaleString('es-AR')),
      h('td', {}, h('b', {}, o.product.name), h('div', { class: 'small muted' }, o.product.size),
        s.orientation ? h('div', { class: 'small' }, 'Orientación: ' + o.product.orientation) : null,
        h('div', { class: 'small' }, colors), o.product.leg ? h('div', { class: 'small' }, 'Patas: ' + o.product.leg) : null),
      h('td', { class: 'small' }, h('b', {}, o.customer.name), h('div', {}, o.customer.email),
        o.customer.phone ? h('div', {}, o.customer.phone) : null, o.customer.dni ? h('div', {}, 'DNI ' + o.customer.dni) : null,
        o.customer.delivery === 'shipping' ? h('div', {}, 'Envío: ' + (o.customer.address || '')) : h('div', {}, 'Retiro en local')),
      h('td', {}, h('span', { class: 'badge ' + fb[1] }, fb[0]), h('div', {}, h('span', { class: 'badge' }, STATUS[o.status] || o.status)),
        o.fulfillment === 'rechazado' && o.rejectReason ? h('div', { class: 'small muted' }, o.rejectReason) : null),
      h('td', {}, h('div', {}, money(o.amount)), h('div', { class: 'small muted' }, o.selection.payment),
        o.mode === 'test' ? h('div', { class: 'badge warn' }, 'Prueba') : null),
      h('td', {}, h('div', { class: 'row', style: 'flex-direction:column;align-items:stretch' }, actions)),
    );
  };
  $('#app').replaceChildren(
    h('div', { class: 'row', style: 'justify-content:space-between;margin-bottom:12px' }, h('h2', {}, 'Pedidos'), h('button', { onclick: () => go('pedidos') }, 'Actualizar')),
    periodBar(),
    h('div', { class: 'filters' }, filterBtns),
    list.length ? h('div', { class: 'card', style: 'padding:0;overflow-x:auto' },
      h('table', {}, h('thead', {}, h('tr', {}, ['Fecha', 'Producto', 'Cliente', 'Estado', 'Importe', 'Acciones'].map((t) => h('th', {}, t)))),
        h('tbody', {}, list.map(rowFor)))) : h('p', { class: 'muted' }, 'No hay pedidos en esta vista.'),
  );
}

async function removeOrder(o) {
  const extra = (o.status === 'paid' || o.status === 'paid_test') ? '\n\nAtención: está pagado. Borrarlo no devuelve el dinero.' : '';
  if (!confirm('¿Borrar el pedido de ' + o.customer.name + ' (' + o.id.slice(0, 8).toUpperCase() + ')?' + extra)) return;
  try { await api('/api/admin/orders/' + o.id, { method: 'DELETE' }); go('pedidos'); }
  catch (e) { alert(e.message); }
}

async function act(o, action, body) {
  try { await api(`/api/admin/orders/${o.id}/${action}`, { method: 'POST', body }); go('pedidos'); }
  catch (e) { alert(e.message); }
}
function reject(o) {
  const paid = o.status === 'paid' || o.status === 'paid_test';
  if (paid && !confirm('Este pedido ya está pagado con Mercado Pago. Rechazarlo no devuelve el dinero: después tenés que reintegrarlo desde Mercado Pago. ¿Seguir?')) return;
  const reason = prompt('Motivo del rechazo (se le muestra al cliente):', '');
  if (reason === null) return;
  act(o, 'reject', { reason });
}
function confirmTransfer(o) {
  const amount = prompt('Importe acreditado en pesos:', String(o.amount));
  if (amount === null) return;
  const reference = prompt('Referencia bancaria (mínimo 4 caracteres):', '');
  if (reference === null) return;
  act(o, 'confirm-transfer', { amount, reference });
}

// --- Productos ---------------------------------------------------------

async function viewProducts() {
  $('#app').replaceChildren(
    h('div', { class: 'row', style: 'justify-content:space-between;margin-bottom:12px' },
      h('h2', {}, 'Productos'), h('button', { class: 'p', onclick: () => editProduct(null) }, '+ Nuevo producto')),
    state.catalog.products.length ? h('div', { class: 'card', style: 'padding:0;overflow-x:auto' },
      h('table', {}, h('thead', {}, h('tr', {}, ['', 'Nombre', 'Precio contado', 'Con tarjeta', 'Opciones', 'Estado', ''].map((t) => h('th', {}, t)))),
        h('tbody', {}, state.catalog.products.map((p) => h('tr', {},
          h('td', {}, p.imageIds[0] ? h('img', { class: 'thumb', src: '/img/' + p.imageIds[0] }) : h('div', { class: 'thumb' })),
          h('td', {}, h('b', {}, p.name), h('div', { class: 'small muted' }, p.size)),
          h('td', {}, money(pesos(p.priceCash))),
          h('td', {}, money(pesos(p.priceCredit))),
          h('td', { class: 'small' },
            p.allowsOrientation ? h('span', { class: 'badge' }, 'Izq./Der.') : null,
            h('span', { class: 'badge' }, p.colorMode === 'split' ? 'Color izq. y der.' : 'Color único'),
            p.allowsLegs ? h('span', { class: 'badge' }, 'Patas') : null,
            h('span', { class: 'badge' }, p.colors.length + ' colores'),
            p.imageIds.length ? h('span', { class: 'badge' }, p.imageIds.length + ' fotos') : null),
          h('td', {}, h('span', { class: 'badge ' + (p.active ? 'ok' : 'bad') }, p.active ? 'Visible' : 'Oculto')),
          h('td', {}, h('button', { onclick: () => editProduct(p) }, 'Editar')),
        ))))) : h('p', { class: 'muted' }, 'Todavía no hay productos. Creá el primero con "+ Nuevo producto".'),
  );
}

function editProduct(p) {
  const draft = p ? {
    id: p.id, name: p.name, description: p.description, category: p.category, size: p.size,
    priceCash: pesos(p.priceCash), priceCredit: pesos(p.priceCredit), maxInstallments: p.maxInstallments,
    allowsOrientation: p.allowsOrientation, colorMode: p.colorMode, allowsLegs: p.allowsLegs, active: p.active,
    imageIds: [...p.imageIds], colorIds: p.colors.map((c) => c.id), legIds: p.legs.map((l) => l.id),
  } : { name: '', description: '', category: '', size: '', priceCash: '', priceCredit: '', maxInstallments: 1, allowsOrientation: false,
    colorMode: 'single', allowsLegs: false, active: true, imageIds: [], colorIds: [], legIds: [] };

  const msg = h('div', {});
  const f = (k) => ({ oninput: (e) => (draft[k] = e.target.value), value: draft[k] ?? '' });
  const toggle = (k, text) => h('label', {}, h('input', { type: 'checkbox', checked: draft[k], onchange: (e) => (draft[k] = e.target.checked) }), ' ' + text);

  const gallery = h('div', { class: 'gallery' });
  const drawGallery = () => gallery.replaceChildren(...draft.imageIds.map((id, i) => h('figure', {},
    h('img', { src: '/img/' + id }),
    h('div', { class: 'row', style: 'justify-content:center;gap:4px;margin-top:4px' },
      i === 0 ? h('span', { class: 'badge ok' }, 'Principal') : h('button', { onclick: () => { draft.imageIds.unshift(...draft.imageIds.splice(i, 1)); drawGallery(); } }, 'Hacer principal'),
      h('button', { class: 'd', onclick: () => { draft.imageIds.splice(i, 1); drawGallery(); } }, 'Quitar')))));
  drawGallery();

  const uploadInput = h('input', { type: 'file', accept: 'image/*', multiple: true, onchange: async (e) => {
    const files = [...e.target.files];
    msg.replaceChildren(h('div', { class: 'msg' }, `Comprimiendo y subiendo ${files.length} foto(s)…`));
    try {
      for (const file of files) draft.imageIds.push(await uploadImage(file, 1400));
      drawGallery(); msg.replaceChildren(h('div', { class: 'msg' }, 'Fotos subidas. Recordá guardar el producto.'));
    } catch (err) { msg.replaceChildren(h('div', { class: 'msg err' }, err.message)); }
    e.target.value = '';
  } });

  const colorChips = h('div', {});
  const drawColors = () => colorChips.replaceChildren(...state.catalog.fabrics.filter((fb) => fb.active).map((fb) =>
    h('div', {}, h('h3', { style: 'margin-top:12px' }, fb.name + (fb.surcharge ? ` (+${fb.surcharge}%)` : '')),
      h('div', { class: 'chips' }, fb.colors.filter((c) => c.active).map((c) => h('label', {},
        h('input', { type: 'checkbox', checked: draft.colorIds.includes(c.id), onchange: (e) => {
          draft.colorIds = e.target.checked ? [...draft.colorIds, c.id] : draft.colorIds.filter((x) => x !== c.id);
        } }), c.name))))));
  drawColors();

  const legChips = h('div', { class: 'chips' }, state.catalog.legs.filter((l) => l.active).map((l) => h('label', {},
    h('input', { type: 'checkbox', checked: draft.legIds.includes(l.id), onchange: (e) => {
      draft.legIds = e.target.checked ? [...draft.legIds, l.id] : draft.legIds.filter((x) => x !== l.id);
    } }), l.name + (l.extra ? ` (+${money(pesos(l.extra))})` : ''))));

  const save = async () => {
    const body = { ...draft };
    try {
      msg.replaceChildren(h('div', { class: 'msg' }, 'Guardando…'));
      if (p) await api('/api/admin/products/' + p.id, { method: 'PUT', body });
      else await api('/api/admin/products', { method: 'POST', body });
      go('productos');
    } catch (err) { msg.replaceChildren(h('div', { class: 'msg err' }, err.message)); }
  };
  const remove = async () => {
    if (!confirm('¿Borrar este producto y sus fotos? Los pedidos ya hechos se conservan.')) return;
    await api('/api/admin/products/' + p.id, { method: 'DELETE' });
    go('productos');
  };

  $('#app').replaceChildren(
    h('div', { class: 'row', style: 'justify-content:space-between;margin-bottom:12px' },
      h('h2', {}, p ? 'Editar producto' : 'Nuevo producto'), h('button', { onclick: () => go('productos') }, '← Volver')),
    msg,
    h('div', { class: 'grid two' },
      h('div', { class: 'card' },
        h('h3', {}, 'Datos del producto'),
        h('label', {}, 'Nombre'), h('input', { ...f('name') }),
        h('label', {}, 'Descripción'), h('textarea', { ...f('description') }),
        h('div', { class: 'grid two', style: 'gap:10px' },
          h('div', {}, h('label', {}, 'Categoría'), h('input', { ...f('category') })),
          h('div', {}, h('label', {}, 'Medidas'), h('input', { ...f('size') }))),
        h('div', { class: 'grid two', style: 'gap:10px' },
          h('div', {}, h('label', {}, 'Precio contado (ARS)'), h('input', { ...f('priceCash'), type: 'number', min: 0, step: 1 })),
          h('div', {}, h('label', {}, 'Precio con tarjeta (ARS)'), h('input', { ...f('priceCredit'), type: 'number', min: 0, step: 1 }))),
        h('label', {}, 'Cuotas máximas con tarjeta (1 = sin cuotas)'), h('input', { ...f('maxInstallments'), type: 'number', min: 1, max: 18, step: 1 }),
        h('p', { class: 'small muted' }, 'El interés de las cuotas se configura en la pestaña Configuración, igual para todos los productos.'),
        h('h3', { style: 'margin-top:18px' }, 'Opciones'),
        h('div', { class: 'inline' }, toggle('active', 'Visible para clientes'), toggle('allowsOrientation', 'Permitir izquierda / derecha (voltea la foto)'),
          toggle('allowsLegs', 'Ofrecer patas o maderas')),
        h('label', {}, 'Colores'),
        h('select', { onchange: (e) => (draft.colorMode = e.target.value) },
          h('option', { value: 'single', selected: draft.colorMode !== 'split' }, 'Un color para todo el sillón'),
          h('option', { value: 'split', selected: draft.colorMode === 'split' }, 'Color distinto izquierda y derecha')),
      ),
      h('div', { class: 'card' },
        h('h3', {}, 'Fotos'),
        h('p', { class: 'small muted' }, 'Se comprimen en tu navegador a WEBP (hasta 1400 px). La primera es la principal.'),
        uploadInput, gallery,
      ),
    ),
    h('div', { class: 'card', style: 'margin-top:14px' }, h('h3', {}, 'Telas y colores disponibles'),
      state.catalog.fabrics.length ? colorChips : h('p', { class: 'muted' }, 'Primero cargá telas y colores en la pestaña "Telas y colores".'),
      h('h3', { style: 'margin-top:18px' }, 'Maderas y patas disponibles'),
      state.catalog.legs.length ? legChips : h('p', { class: 'muted' }, 'Primero cargá opciones en la pestaña "Maderas y patas".')),
    h('div', { class: 'row', style: 'margin-top:16px' },
      h('button', { class: 'p', onclick: save }, 'Guardar producto'),
      p ? h('button', { class: 'd', onclick: remove }, 'Borrar producto') : null),
  );
}

// --- Telas y colores -----------------------------------------------------

async function viewFabrics() {
  const cat = state.catalog;
  const newFabric = h('div', { class: 'card', style: 'margin-bottom:14px' }, h('h3', {}, 'Nueva tela'),
    h('div', { class: 'row' }, nameInput = h('input', { placeholder: 'Nombre (ej. Pana Shot)', style: 'max-width:260px' }),
      surInput = h('input', { type: 'number', min: 0, max: 100, placeholder: 'Recargo %', style: 'max-width:140px' }),
      h('button', { class: 'p', onclick: async () => {
        try { await api('/api/admin/fabrics', { method: 'POST', body: { name: nameInput.value, surcharge: surInput.value } }); go('telas'); }
        catch (e) { alert(e.message); }
      } }, 'Agregar tela')));
  $('#app').replaceChildren(h('h2', {}, 'Telas y colores'), newFabric,
    ...cat.fabrics.map((fb) => fabricCard(fb)));
  if (!cat.fabrics.length) $('#app').append(h('p', { class: 'muted' }, 'Todavía no hay telas. Empezá agregando una arriba.'));
}
let nameInput, surInput;

function fabricCard(fb) {
  const fname = h('input', { value: fb.name, style: 'max-width:260px' });
  const fsur = h('input', { type: 'number', min: 0, max: 100, value: fb.surcharge, style: 'max-width:120px' });
  const factive = h('input', { type: 'checkbox', checked: fb.active });
  const colorName = h('input', { placeholder: 'Nombre del color', style: 'max-width:220px' });
  const colorImg = h('input', { type: 'file', accept: 'image/*' });
  return h('div', { class: 'card', style: 'margin-bottom:14px' },
    h('div', { class: 'row' }, fname, fsur, h('span', { class: 'small' }, '% recargo'),
      h('label', { class: 'small', style: 'margin:0' }, factive, ' Visible'),
      h('button', { onclick: async () => { await api('/api/admin/fabrics/' + fb.id, { method: 'PUT', body: { name: fname.value, surcharge: fsur.value, active: factive.checked } }); go('telas'); } }, 'Guardar'),
      h('button', { class: 'd', onclick: async () => { if (confirm('¿Borrar la tela y todos sus colores?')) { await api('/api/admin/fabrics/' + fb.id, { method: 'DELETE' }); go('telas'); } } }, 'Borrar tela')),
    h('table', { style: 'margin-top:12px' }, h('tbody', {}, fb.colors.map((c) => colorRow(c, fb)))),
    h('div', { class: 'row', style: 'margin-top:12px' }, h('b', { class: 'small' }, 'Nuevo color:'), colorName, colorImg,
      h('button', { class: 'p', onclick: async () => {
        if (!colorName.value.trim()) return alert('Poné un nombre para el color.');
        try {
          const imageId = colorImg.files[0] ? await uploadImage(colorImg.files[0], 400) : null;
          await api('/api/admin/fabric-colors', { method: 'POST', body: { fabricId: fb.id, name: colorName.value, imageId } });
          go('telas');
        } catch (e) { alert(e.message); }
      } }, 'Agregar color')));
}

function colorRow(c, fb) {
  const cname = h('input', { value: c.name, style: 'max-width:220px' });
  const cactive = h('input', { type: 'checkbox', checked: c.active });
  const cimg = h('input', { type: 'file', accept: 'image/*' });
  return h('tr', {},
    h('td', {}, c.imageId ? h('img', { class: 'swatch', src: '/img/' + c.imageId }) : h('div', { class: 'swatch' })),
    h('td', {}, cname),
    h('td', {}, h('label', { class: 'small', style: 'margin:0' }, cactive, ' Visible')),
    h('td', {}, cimg),
    h('td', { class: 'row' },
      h('button', { onclick: async () => {
        try {
          const imageId = cimg.files[0] ? await uploadImage(cimg.files[0], 400) : c.imageId;
          await api('/api/admin/fabric-colors/' + c.id, { method: 'PUT', body: { name: cname.value, imageId, active: cactive.checked } });
          go('telas');
        } catch (e) { alert(e.message); }
      } }, 'Guardar'),
      h('button', { class: 'd', onclick: async () => { if (confirm('¿Borrar este color?')) { await api('/api/admin/fabric-colors/' + c.id, { method: 'DELETE' }); go('telas'); } } }, 'Borrar')));
}

// --- Maderas y patas -----------------------------------------------------

async function viewLegs() {
  const nameI = h('input', { placeholder: 'Nombre (ej. Clásicas de madera)', style: 'max-width:280px' });
  const extraI = h('input', { type: 'number', min: 0, placeholder: 'Adicional ARS', style: 'max-width:160px' });
  const imgI = h('input', { type: 'file', accept: 'image/*' });
  $('#app').replaceChildren(h('h2', {}, 'Maderas y patas'),
    h('div', { class: 'card', style: 'margin-bottom:14px' }, h('h3', {}, 'Nueva opción'),
      h('div', { class: 'row' }, nameI, extraI, imgI,
        h('button', { class: 'p', onclick: async () => {
          try {
            const imageId = imgI.files[0] ? await uploadImage(imgI.files[0], 600) : null;
            await api('/api/admin/legs', { method: 'POST', body: { name: nameI.value, extra: extraI.value || 0, imageId } });
            go('patas');
          } catch (e) { alert(e.message); }
        } }, 'Agregar'))),
    state.catalog.legs.length ? h('div', { class: 'card', style: 'padding:0;overflow-x:auto' },
      h('table', {}, h('thead', {}, h('tr', {}, ['', 'Nombre', 'Adicional', 'Visible', 'Cambiar foto', ''].map((t) => h('th', {}, t)))),
        h('tbody', {}, state.catalog.legs.map(legRow)))) : h('p', { class: 'muted' }, 'Todavía no hay opciones de patas o maderas.'));
}

function legRow(l) {
  const n = h('input', { value: l.name, style: 'max-width:220px' });
  const e = h('input', { type: 'number', min: 0, value: pesos(l.extra), style: 'max-width:130px' });
  const a = h('input', { type: 'checkbox', checked: l.active });
  const i = h('input', { type: 'file', accept: 'image/*' });
  return h('tr', {},
    h('td', {}, l.imageId ? h('img', { class: 'thumb', src: '/img/' + l.imageId }) : h('div', { class: 'thumb' })),
    h('td', {}, n), h('td', {}, e), h('td', {}, a), h('td', {}, i),
    h('td', { class: 'row' },
      h('button', { onclick: async () => {
        try {
          const imageId = i.files[0] ? await uploadImage(i.files[0], 600) : l.imageId;
          await api('/api/admin/legs/' + l.id, { method: 'PUT', body: { name: n.value, extra: e.value || 0, imageId, active: a.checked } });
          go('patas');
        } catch (err) { alert(err.message); }
      } }, 'Guardar'),
      h('button', { class: 'd', onclick: async () => { if (confirm('¿Borrar esta opción?')) { await api('/api/admin/legs/' + l.id, { method: 'DELETE' }); go('patas'); } } }, 'Borrar')));
}

// --- Ingreso ----------------------------------------------------------------

function showLogin() {
  nav2();
  const pw = h('input', { type: 'password', placeholder: 'Contraseña del panel', autocomplete: 'current-password' });
  const msg = h('div', { class: 'msg err', hidden: true });
  const submit = async () => {
    try {
      await api('/api/admin/login', { method: 'POST', body: { password: pw.value } });
      nav(); go('dashboard');
    } catch (e) { msg.textContent = e.message; msg.hidden = false; }
  };
  pw.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
  $('#app').replaceChildren(h('div', { class: 'card', style: 'max-width:380px;margin:60px auto' },
    h('h2', {}, 'Ingresar'), h('p', { class: 'muted' }, 'Ingresá la contraseña del panel de Sophie.'),
    pw, h('div', { class: 'row', style: 'margin-top:12px' }, h('button', { class: 'p', onclick: submit }, 'Entrar')), msg));
}
function nav2() { $('#nav').replaceChildren(); }

// --- Configuración de pagos -----------------------------------------------

async function viewSettings() {
  const s = await api('/api/admin/settings');
  const interest = h('input', { type: 'number', min: 0, max: 200, step: '0.01', value: s.interestPercent });
  const sena = h('input', { type: 'number', min: 0, max: 100, step: '0.01', value: s.senaPercent });
  const msg = h('div', {});
  $('#app').replaceChildren(
    h('h2', {}, 'Configuración de pagos'),
    h('div', { class: 'card', style: 'max-width:640px' },
      h('h3', {}, 'Tarjeta de crédito'),
      h('label', {}, 'Interés de cuotas (%). 0 = sin interés'), interest,
      h('p', { class: 'small muted' }, 'Se suma al precio con tarjeta de cada producto. Las cuotas máximas se eligen en cada producto.'),
      h('h3', { style: 'margin-top:22px' }, 'Seña por transferencia y otros medios'),
      h('label', {}, 'Porcentaje que paga el cliente al confirmar (%)'), sena,
      h('p', { class: 'small muted' }, 'Aplica a transferencia, Mercado Pago y débito. Lo que queda se coordina con Sophie.'),
      msg,
      h('div', { class: 'row', style: 'margin-top:16px' }, h('button', { class: 'p', onclick: async () => {
        try {
          await api('/api/admin/settings', { method: 'PUT', body: { interestPercent: interest.value, senaPercent: sena.value } });
          msg.replaceChildren(h('div', { class: 'msg' }, 'Configuración guardada. Se aplica a los próximos pedidos.'));
        } catch (e) { msg.replaceChildren(h('div', { class: 'msg err' }, e.message)); }
      } }, 'Guardar configuración'))));
}

// Arranque: si ya hay sesión se entra directo; si no, se pide la contraseña.
fetch('/api/admin/session', { cache: 'no-store' }).then((r) => {
  if (r.ok) { nav(); go('dashboard'); } else showLogin();
}).catch(showLogin);
</script>
</body>
