<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f4ef">
<title>Sophie · Diseñá tu sillón</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f6f2;color:#303c35;font:15px system-ui,sans-serif}
header{height:80px;border-bottom:1px solid #dddeda;background:#fff;display:flex;align-items:center;padding:0 6%}
.brand{font:28px Georgia,serif;letter-spacing:1px}
.intro{padding:32px 6% 8px}
.intro h1{font:clamp(30px,4vw,48px) Georgia,serif;margin:0 0 8px}
.intro p{color:#6f776d;margin:0}
section{margin:24px 6%}
h2{font-size:13px;letter-spacing:1.5px;font-weight:600;color:#6f776d;text-transform:uppercase;margin:0 0 12px}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:#fff;border:1px solid #e0e2da;border-radius:14px;padding:12px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.card[aria-pressed=true]{border-color:#657659;box-shadow:0 0 0 2px #657659 inset}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:#eee;display:block}
.card strong{display:block;margin-top:10px;font-weight:600}
.card small{color:#7a8276}
.card .price{display:block;margin-top:6px;font-weight:600}
.stage{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,1fr);gap:20px;background:#fff;border:1px solid #dedfd7;border-radius:18px;padding:20px}
@media(max-width:820px){.stage{grid-template-columns:1fr}}
.preview{background:#ebe9e2;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:320px}
.preview img{max-width:100%;max-height:520px;transition:transform .3s}
.preview img.flip{transform:scaleX(-1)}
.opts>div{margin-bottom:22px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1px solid #cfd3c8;background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;font:inherit}
.pill[aria-pressed=true]{background:#657659;color:#fff;border-color:#657659}
.fabric{font-size:12px;color:#7a8276;margin:10px 0 6px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{border:0;background:none;padding:0;cursor:pointer;text-align:center;font:11px system-ui;color:#4d564c;width:64px}
.sw img,.sw span.dot{width:52px;height:52px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 4px;border:2px solid transparent;background:#ddd}
.sw[aria-pressed=true] img,.sw[aria-pressed=true] span.dot{border-color:#657659;box-shadow:0 0 0 2px #fff inset}
.legs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.legs button{border:1px solid #e0e2da;background:#fff;border-radius:12px;padding:8px;cursor:pointer;font:inherit;text-align:center}
.legs button[aria-pressed=true]{border-color:#657659;box-shadow:0 0 0 2px #657659 inset}
.legs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#eee}
label{display:block;font-size:12px;color:#6f776d;margin:10px 0 4px}
input,select{width:100%;font:inherit;padding:10px;border:1px solid #cfd3c8;border-radius:10px;background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px}
.check input{width:auto}
.summary{background:#f4f6f0;border-radius:12px;padding:14px;margin-top:6px}
.summary div{display:flex;justify-content:space-between;padding:4px 0}
.summary .big{font:600 22px Georgia,serif;margin-top:6px}
button.go{width:100%;margin-top:14px;background:#657659;color:#fff;border:0;border-radius:12px;padding:14px;font:600 15px system-ui;cursor:pointer}
button.go:disabled{background:#b9c0af;cursor:not-allowed}
.msg{font-size:13px;color:#6f776d;min-height:18px;margin-top:8px}
.msg.err{color:#a33}
.empty{color:#7a8276;padding:30px;text-align:center;background:#fff;border-radius:14px}
</style>
</head>
<body>
<header><div class="brand">SOPHIE<small style="display:block;font:9px system-ui;letter-spacing:3px">LIVING</small></div></header>
<div class="intro"><h1>Diseñá tu sillón</h1><p>Elegí el modelo, la tela y las patas. Te mostramos el total antes de pagar.</p></div>

<section>
  <h2>1 · Modelo</h2>
  <div id="products" class="products"></div>
  <div id="noProducts" class="empty" hidden>Todavía no hay modelos disponibles.</div>
</section>

<section id="configurator" hidden>
  <div class="stage">
    <div class="preview"><img id="preview" alt=""></div>
    <div class="opts">
      <div id="orientationBox">
        <h2>2 · Orientación</h2>
        <div class="seg" id="orientation"></div>
      </div>
      <div id="colorsBox"></div>
      <div id="legsBox">
        <h2>4 · Patas o madera</h2>
        <div class="legs" id="legs"></div>
      </div>
      <div>
        <h2>5 · Pago</h2>
        <div class="seg" id="payments"></div>
        <p class="msg" id="availability"></p>
      </div>
      <div>
        <h2>6 · Tus datos</h2>
        <form id="customer">
          <label>Nombre y apellido</label><input name="name" required minlength="2" maxlength="120" autocomplete="name">
          <div class="two">
            <div><label>Email</label><input name="email" type="email" required maxlength="200" autocomplete="email"></div>
            <div><label>DNI</label><input name="dni" required pattern="\d{7,9}" inputmode="numeric" placeholder="sin puntos"></div>
          </div>
          <label>Teléfono</label><input name="phone" required pattern="\+?[\d\s()-]{7,40}" autocomplete="tel">
          <label>Entrega</label>
          <select name="delivery" id="delivery">
            <option value="pickup">Retiro en el local</option>
            <option value="shipping">Envío a domicilio</option>
          </select>
          <div id="addressBox" hidden>
            <label>Domicilio</label><input name="address" maxlength="500">
            <label class="check"><input type="checkbox" name="shippingAccepted"> Entiendo que el envío se cotiza aparte.</label>
          </div>
        </form>
      </div>
      <div>
        <h2>Resumen</h2>
        <div class="summary" id="summary"><div>Elegí todas las opciones para ver el total.</div></div>
        <button class="go" id="submit" disabled>Continuar</button>
        <p class="msg" id="status"></p>
      </div>
    </div>
  </div>
</section>

<script>
const $ = (s) => document.querySelector(s);
const money = (n) => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(n);
const img = (id) => (id ? '/img/' + id : '');
const PAYMENTS = ['Mercado Pago', 'Transferencia', 'Tarjeta de débito', 'Tarjeta de crédito'];
let catalog = null, checkoutStatus = null, product = null, sel = null, quoteTimer = null, busy = false;

function h(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}

async function init() {
  const [cat, status] = await Promise.all([
    fetch('/api/catalog', { cache: 'no-store' }).then((r) => r.json()),
    fetch('/api/checkout', { cache: 'no-store' }).then((r) => r.json()).catch(() => null),
  ]);
  catalog = cat; checkoutStatus = status;
  renderProducts();
  $('#customer').addEventListener('input', updateButton);
  $('#delivery').addEventListener('change', () => { $('#addressBox').hidden = $('#delivery').value !== 'shipping'; scheduleQuote(); updateButton(); });
  $('#submit').addEventListener('click', submit);
}

function renderProducts() {
  const box = $('#products');
  if (!catalog.products.length) { $('#noProducts').hidden = false; return; }
  box.replaceChildren(...catalog.products.map((p) => h('button', { class: 'card', type: 'button', 'aria-pressed': false, onclick: () => choose(p.id) },
    h('img', { src: img(p.imageIds[0]), alt: p.name, loading: 'lazy' }),
    h('strong', {}, p.name),
    h('small', {}, p.size),
    h('span', { class: 'price' }, 'desde ' + money(p.priceCash / 100)),
  )));
}

function choose(id) {
  product = catalog.products.find((p) => p.id === id);
  document.querySelectorAll('#products .card').forEach((b, i) => b.setAttribute('aria-pressed', catalog.products[i].id === id));
  sel = { productId: id, orientation: 'left', colorLeft: product.colors[0] ? product.colors[0].id : null,
    colorRight: product.colors[0] ? product.colors[0].id : null, legId: null, payment: null };
  $('#configurator').hidden = false;
  render();
  $('#configurator').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function render() {
  const pic = $('#preview');
  pic.src = img(product.imageIds[0]);
  pic.alt = product.name;
  pic.className = product.allowsOrientation && sel.orientation === 'right' ? 'flip' : '';
  $('#orientationBox').hidden = !product.allowsOrientation;
  $('#orientation').replaceChildren(...[['left', 'Izquierda'], ['right', 'Derecha']].map(([v, t]) =>
    h('button', { class: 'pill', type: 'button', 'aria-pressed': sel.orientation === v, onclick: () => { sel.orientation = v; render(); } }, t)));
  renderColors();
  $('#legsBox').hidden = !product.allowsLegs;
  $('#legs').replaceChildren(...product.legs.map((l) => h('button', { type: 'button', 'aria-pressed': sel.legId === l.id, onclick: () => { sel.legId = l.id; render(); } },
    h('img', { src: img(l.imageId), alt: '' }), h('strong', { style: 'display:block;margin-top:6px;font-weight:500' }, l.name),
    l.extra ? h('small', { style: 'color:#7a8276' }, '+ ' + money(l.extra / 100)) : null)));
  $('#payments').replaceChildren(...PAYMENTS.map((p) => h('button', { class: 'pill', type: 'button', 'aria-pressed': sel.payment === p,
    onclick: () => { sel.payment = p; render(); } }, p)));
  $('#availability').textContent = !checkoutStatus ? 'No pudimos consultar los medios de pago. Recargá la página.'
    : sel.payment === 'Transferencia' && !checkoutStatus.transferEnabled ? 'Las transferencias todavía no están habilitadas.'
    : sel.payment && sel.payment !== 'Transferencia' && !checkoutStatus.enabled ? 'Los pagos online todavía no están habilitados.'
    : checkoutStatus.mode === 'test' && sel.payment && sel.payment !== 'Transferencia' ? 'Modo de prueba: no se realizan cobros reales.' : '';
  scheduleQuote();
  updateButton();
}

function renderColors() {
  const box = $('#colorsBox');
  const groups = [];
  const byFabric = (fn) => {
    const map = new Map();
    for (const c of product.colors) { if (!map.has(c.fabric)) map.set(c.fabric, []); map.get(c.fabric).push(c); }
    return [...map.entries()].map(([fabric, colors]) => h('div', {}, h('div', { class: 'fabric' }, fabric + (colors[0].surcharge ? ` (+${colors[0].surcharge}%)` : '')),
      h('div', { class: 'swatches' }, colors.map((c) => h('button', { class: 'sw', type: 'button', 'aria-pressed': fn.selected(c.id), onclick: () => fn.pick(c.id) },
        c.imageId ? h('img', { src: img(c.imageId), alt: '' }) : h('span', { class: 'dot' }), c.name)))));
  };
  if (product.colorMode === 'split') {
    box.replaceChildren(h('h2', {}, '3 · Colores (izquierda y derecha)'),
      h('label', {}, 'Pieza izquierda'), byFabric({ selected: (id) => sel.colorLeft === id, pick: (id) => { sel.colorLeft = id; render(); } }),
      h('label', {}, 'Pieza derecha'), byFabric({ selected: (id) => sel.colorRight === id, pick: (id) => { sel.colorRight = id; render(); } }));
  } else {
    box.replaceChildren(h('h2', {}, '3 · Color de tela'), byFabric({ selected: (id) => sel.colorLeft === id, pick: (id) => { sel.colorLeft = id; sel.colorRight = id; render(); } }));
  }
  void groups;
}

function scheduleQuote() {
  clearTimeout(quoteTimer);
  quoteTimer = setTimeout(updateQuote, 150);
}

async function updateQuote() {
  const box = $('#summary');
  if (!sel.payment || !sel.colorLeft || (product.allowsLegs && !sel.legId)) {
    box.replaceChildren(h('div', {}, 'Elegí todas las opciones para ver el total.'));
    return;
  }
  try {
    const r = await fetch('/api/quote', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ selection: sel }) });
    const q = await r.json();
    if (!r.ok) throw Error(q.error);
    box.replaceChildren(
      h('div', {}, h('span', {}, q.credit ? 'Precio de lista' : 'Precio contado'), h('span', {}, money(q.total))),
      q.surcharge ? h('div', {}, h('span', {}, 'Incluye recargo de tela'), h('span', {}, '+' + q.surcharge + '%')) : null,
      q.interest ? h('div', {}, h('span', {}, 'Incluye interés de cuotas'), h('span', {}, '+' + q.interest + '%')) : null,
      h('div', {}, h('span', {}, q.credit ? 'Importe a pagar' : 'Seña ' + q.senaPercent + '%'), h('span', { class: 'big' }, money(q.due))),
      q.credit ? null : h('div', {}, h('span', {}, 'Saldo del sillón'), h('span', {}, money(q.balance))),
      h('p', { class: 'msg' }, q.credit ? 'Podés pagar en hasta ' + q.maxInstallments + ' cuotas. Las elegís en Mercado Pago antes de confirmar.' : 'El saldo se coordina con Sophie al retirar o entregar.'));
    box.dataset.ok = '1';
  } catch (e) {
    box.replaceChildren(h('div', { class: 'msg err' }, e.message));
    box.dataset.ok = '';
  }
  updateButton();
}

function updateButton() {
  const form = $('#customer');
  const ready = product && sel && sel.payment && $('#summary').dataset.ok === '1' && form.checkValidity()
    && (checkoutStatus && (sel.payment === 'Transferencia' ? checkoutStatus.transferEnabled : checkoutStatus.enabled));
  $('#submit').disabled = busy || !ready;
  $('#submit').textContent = busy ? 'Guardando tu pedido…' : sel && sel.payment === 'Transferencia' ? 'Ver datos para transferir →' : 'Pagar con Mercado Pago →';
}

async function submit() {
  const form = $('#customer');
  if (!form.reportValidity()) return;
  busy = true; updateButton();
  const data = Object.fromEntries(new FormData(form));
  const customer = { name: data.name, email: data.email, dni: data.dni, phone: data.phone, delivery: data.delivery,
    address: data.address || '', shippingAccepted: form.elements.shippingAccepted ? form.elements.shippingAccepted.checked : false };
  let requestId = sessionStorage.getItem('sophie-request');
  if (!requestId) { requestId = crypto.randomUUID(); sessionStorage.setItem('sophie-request', requestId); }
  try {
    const r = await fetch('/api/checkout', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'create', requestId, selection: sel, customer }) });
    const order = await r.json();
    if (!order.id) throw Error(order.error || 'No se pudo preparar el pedido.');
    sessionStorage.removeItem('sophie-request');
    location.assign('/pago.html?id=' + encodeURIComponent(order.id));
  } catch (e) {
    $('#status').textContent = e.message;
    $('#status').className = 'msg err';
    busy = false; updateButton();
  }
}

init().catch(() => { $('#products').textContent = 'No pudimos cargar los modelos. Recargá la página.'; });
</script>
</body>
</html>
