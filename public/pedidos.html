<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sophie · Pedidos</title>
<style>
body{margin:0;background:#f7f6f2;color:#303c35;font:14px system-ui,sans-serif}
header{padding:20px 5%;border-bottom:1px solid #dddeda;background:#fff}
h1{font:24px Georgia,serif;margin:0}
main{padding:20px 5%;overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{text-align:left;padding:10px;border-bottom:1px solid #eee;vertical-align:top}
th{font-size:12px;color:#777e75;font-weight:600}
input{padding:7px;border:1px solid #cfd3c8;border-radius:6px;margin:2px 0;width:130px}
button{padding:7px 12px;border:0;border-radius:6px;background:#657659;color:#fff;cursor:pointer}
.muted{color:#777e75}
.err{color:#a33}
</style>
</head>
<body>
<header><h1>Pedidos</h1><p class="muted" id="msg">Cargando…</p></header>
<main>
  <table>
    <thead><tr><th>Fecha</th><th>Pedido</th><th>Cliente</th><th>Modelo</th><th>Medio</th><th>Estado</th><th>Importe</th><th>Acción</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<script>
const money = (n) => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(n);
const msg = document.getElementById('msg');
const tbody = document.getElementById('rows');

function cell(text) { const td = document.createElement('td'); td.textContent = text ?? ''; return td; }

function confirmForm(o) {
  const td = document.createElement('td');
  const amount = document.createElement('input'); amount.type = 'number'; amount.step = '0.01'; amount.placeholder = 'Importe';
  const ref = document.createElement('input'); ref.placeholder = 'Ref. bancaria';
  const btn = document.createElement('button'); btn.textContent = 'Confirmar transferencia';
  btn.onclick = async () => {
    btn.disabled = true;
    const r = await fetch('/api/admin/orders/' + encodeURIComponent(o.id) + '/confirm-transfer', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ amount: amount.value, reference: ref.value }),
    });
    const body = await r.json();
    if (!r.ok) { msg.textContent = body.error; msg.className = 'err'; btn.disabled = false; return; }
    load();
  };
  td.append(amount, document.createElement('br'), ref, document.createElement('br'), btn);
  return td;
}

async function load() {
  const r = await fetch('/api/admin/orders', { cache: 'no-store' });
  if (!r.ok) { msg.textContent = 'Acceso restringido.'; msg.className = 'err'; return; }
  const { orders } = await r.json();
  msg.textContent = orders.length + ' pedidos (últimos 100)';
  tbody.replaceChildren(...orders.map((o) => {
    const tr = document.createElement('tr');
    tr.append(
      cell(new Date(o.createdAt).toLocaleString('es-AR')),
      cell(o.id.slice(0, 8).toUpperCase()),
      cell(o.customer.name + ' · ' + o.customer.email),
      cell(o.product.name + ' · ' + o.product.fabric + ' · ' + o.product.color),
      cell(o.selection.payment),
      cell(o.statusLabel),
      cell(money(o.amount)),
      o.status === 'awaiting_transfer' ? confirmForm(o) : cell('—'),
    );
    return tr;
  }));
}

load();
</script>
</body>
</html>
